name: Dependent Jobs Workflow

on:
  push:

jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Run first task
        run: echo "First job running..."

  second_job:
    needs: first_job
    runs-on: ubuntu-latest
    steps:
      - name: Run second task
        run: echo "First job succeeded, so now the second job is running."
